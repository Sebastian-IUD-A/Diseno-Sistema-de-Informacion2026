# Nginx dentro del contenedor del frontend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Peticiones a la API → contenedor "backend" (mismo origen para el navegador: sin CORS).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Archivos con hash en el nombre: se pueden guardar en caché mucho tiempo.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Aplicación de una sola página (SPA): cualquier ruta desconocida devuelve index.html
    # y React Router decide qué pantalla mostrar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
